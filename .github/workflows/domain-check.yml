name: Check the custom domain

# Read-only check of the custom domain: the Pages settings as GitHub reports them, then the DNS
# answers and the HTTPS behaviour observed from a GitHub-hosted runner (RUNBOOK §3 and §11).
# Run it from Actions → "Check the custom domain" → Run workflow, before invitations go out, after
# any DNS change (for example moving the nameservers), and in the week before the wedding.
# It deploys nothing and changes no setting.
#
# GitHub's own Pages health-check endpoint needs repository-administrator rights, which the
# workflow token cannot carry, so the checks below query public resolvers and the site directly.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      OWNER: ${{ github.repository_owner }}
    steps:
      - name: Pages settings
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pages" > pages.json
          {
            echo "## GitHub Pages settings"
            echo
            jq -r '
              "- Source: \(.build_type)" + (if .build_type == "legacy" then " (branch \(.source.branch // "?")\(.source.path // ""))" else "" end),
              "- Custom domain: \(.cname // "none")",
              "- URL: \(.html_url // "n/a")",
              "- Enforce HTTPS: \(.https_enforced)",
              "- Certificate: \(.https_certificate.state // "n/a") — \(.https_certificate.description // "")",
              "- Site status: \(.status // "n/a")"
            ' pages.json
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: DNS answers from public resolvers
        id: dns
        continue-on-error: true
        run: |
          set -uo pipefail
          command -v dig > /dev/null || { sudo apt-get update -qq > /dev/null; sudo apt-get install -y -qq dnsutils > /dev/null; }
          DOMAIN=$(jq -r '.cname // empty' pages.json)
          if [ -z "$DOMAIN" ]; then echo "::error::No custom domain is configured for GitHub Pages."; exit 1; fi
          WWW="www.$DOMAIN"
          EXPECTED_A="185.199.108.153 185.199.109.153 185.199.110.153 185.199.111.153"
          EXPECTED_CNAME="${OWNER,,}.github.io."
          echo "DOMAIN=$DOMAIN" >> "$GITHUB_ENV"
          echo "WWW=$WWW" >> "$GITHUB_ENV"

          q() { dig +short +time=5 +tries=2 "$@" 2>/dev/null | sort | tr '\n' ' ' | sed 's/ *$//'; }
          cell() { [ -n "$1" ] && printf '%s' "$1" | sed 's/ /<br>/g' || printf '—'; }

          {
            echo "## DNS answers"
            echo
            echo "Expected for GitHub Pages: \`$DOMAIN\` A records $EXPECTED_A and nothing else; \`$WWW\` CNAME to \`$EXPECTED_CNAME\`; no proxy in front. The nameserver row shows which DNS host is authoritative (iwantmyname until the move, then Cloudflare)."
            echo
            echo "| Query | Runner resolver | Cloudflare 1.1.1.1 | Google 8.8.8.8 |"
            echo "|---|---|---|---|"
            for spec in "NS $DOMAIN" "A $DOMAIN" "AAAA $DOMAIN" "CNAME $WWW" "CAA $DOMAIN" "MX $DOMAIN" "TXT $DOMAIN"; do
              set -- $spec
              printf '| %s `%s` | %s | %s | %s |\n' "$1" "$2" "$(cell "$(q "$1" "$2")")" "$(cell "$(q @1.1.1.1 "$1" "$2")")" "$(cell "$(q @8.8.8.8 "$1" "$2")")"
            done
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"

          fail=0
          expected_sorted=$(printf '%s\n' $EXPECTED_A | sort | tr '\n' ' ' | sed 's/ *$//')
          match=0
          for a in "$(q A "$DOMAIN")" "$(q @1.1.1.1 A "$DOMAIN")" "$(q @8.8.8.8 A "$DOMAIN")"; do
            [ "$a" = "$expected_sorted" ] && match=$((match + 1))
          done
          if [ "$match" -eq 0 ]; then
            echo "::error::No resolver returns exactly the four GitHub Pages addresses for $DOMAIN. If the answers are Cloudflare addresses, the record is proxied: set it to DNS only."
            fail=1
          elif [ "$match" -lt 3 ]; then
            echo "::warning::The resolvers disagree on the A records for $DOMAIN. Propagation may still be in progress; run this check again later."
          fi
          www=$(q @1.1.1.1 CNAME "$WWW")
          if [ "$www" != "$EXPECTED_CNAME" ]; then
            echo "::warning::$WWW does not CNAME to $EXPECTED_CNAME (answer: ${www:-none}). The www address will not reach the site."
          fi
          ns=$(q @1.1.1.1 NS "$DOMAIN")
          case "$ns" in
            *ns.cloudflare.com*) echo "Nameservers: Cloudflare ($ns)";;
            *) echo "Nameservers: $ns";;
          esac
          [ "$fail" -eq 0 ] || exit 1

      - name: HTTPS and certificate
        id: https
        if: always()
        continue-on-error: true
        run: |
          set -uo pipefail
          if [ -z "${DOMAIN:-}" ]; then echo "No custom domain to probe."; exit 0; fi
          http() { curl -sS -o /dev/null -m 20 -w '%{http_code} %{redirect_url}' "$1" 2>/dev/null | sed 's/ *$//' || echo "no response"; }
          hdr() { curl -sS -I -m 20 "$1" 2>/dev/null | tr -d '\r' | awk -F': ' 'tolower($1)=="server"{print $2; exit}'; }
          cert=$(echo | openssl s_client -servername "$DOMAIN" -connect "$DOMAIN:443" 2>/dev/null | openssl x509 -noout -issuer -enddate 2>/dev/null || true)
          issuer=$(printf '%s\n' "$cert" | sed -n 's/^issuer=//p')
          expires=$(printf '%s\n' "$cert" | sed -n 's/^notAfter=//p')
          apex=$(http "https://$DOMAIN/")
          plain=$(http "http://$DOMAIN/")
          wwws=$(http "https://$WWW/")
          server=$(hdr "https://$DOMAIN/")
          {
            echo "## HTTPS and certificate"
            echo
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| https://$DOMAIN/ | $apex |"
            echo "| http://$DOMAIN/ (should redirect to https) | $plain |"
            echo "| https://$WWW/ (GitHub redirects to the apex) | $wwws |"
            echo "| Server header | ${server:-—} |"
            echo "| Certificate issuer | ${issuer:-—} |"
            echo "| Certificate expires | ${expires:-—} |"
            echo
          } | tee -a "$GITHUB_STEP_SUMMARY"

          fail=0
          case "$apex" in 200*) ;; *) echo "::error::https://$DOMAIN/ answered '$apex', not 200."; fail=1;; esac
          case "$server" in
            GitHub.com) ;;
            cloudflare*) echo "::error::Responses come from Cloudflare, not GitHub Pages: the domain is proxied. Set the GitHub Pages records to DNS only."; fail=1;;
            *) echo "::warning::Server header is '${server:-empty}', expected GitHub.com.";;
          esac
          case "$plain" in 301*https://*) ;; *) echo "::warning::http://$DOMAIN/ does not redirect to HTTPS ('$plain'). Enforce HTTPS may be off or not yet active.";; esac
          case "$wwws" in 200*|301*|302*) ;; *) echo "::warning::https://$WWW/ answered '$wwws'.";; esac
          [ "$fail" -eq 0 ] || exit 1

      - name: Verdict
        if: always()
        run: |
          if [ "${{ steps.dns.outcome }}" = "failure" ] || [ "${{ steps.https.outcome }}" = "failure" ]; then
            echo "::error::The custom domain check failed. See the job summary for the failing table."
            exit 1
          fi
          echo "Custom domain checks pass."
